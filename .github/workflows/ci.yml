name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff check
        run: python -m ruff check src tests examples
      - name: Pytest
        run: python -m pytest -q
      - name: Benchmark L0
        run: python -m vencertia.cli benchmark run --level L0
      - name: API smoke
        run: python -c "from vencertia.api import app; print('API import OK')"
      - name: CLI smoke
        run: python -c "from vencertia.cli import app; print('CLI import OK')"
