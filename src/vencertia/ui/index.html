<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vencertia 决策复盘器</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">V</span>
      <div>
        <h1>Vencertia 决策复盘器</h1>
        <p class="sub">记录你的判断 · 追踪结果 · 用校准证明决策质量</p>
      </div>
    </div>
    <div id="health" class="health">…</div>
  </header>

  <main class="layout">
    <aside class="panel form-panel">
      <h2>发起一个新决策</h2>
      <form id="solve-form">
        <label>你要做什么决定？<span class="req">*</span>
          <textarea id="problem" rows="4" placeholder="例：是否投入 6 周做 B2B SaaS MVP？" required></textarea>
        </label>
        <div class="row">
          <label>决策模式
            <select id="mode">
              <option value="">自动（默认）</option>
              <option value="EXPLORE">探索方向</option>
              <option value="OPERATE">经营决策</option>
            </select>
          </label>
          <label>风险容忍度
            <select id="risk">
              <option value="">未设置</option>
              <option value="0.3">风险厌恶（求稳）</option>
              <option value="0.5">风险中性</option>
              <option value="0.8">风险偏好（敢冒风险）</option>
            </select>
          </label>
        </div>
        <button type="submit" id="solve-btn">开始判断</button>
        <p class="hint">给出一个可解释的判断；记录会自动进入右侧台账。</p>
      </form>
      <div id="solve-error" class="error" hidden></div>
      <div id="solve-result" class="solve-result"></div>

      <section id="history-section" hidden>
        <div class="history-head">
          <h3>最近判断</h3>
          <button type="button" id="history-clear" class="link-btn">清空</button>
        </div>
        <div id="history-list"></div>
      </section>
    </aside>

    <section class="review-main">
      <section class="panel">
        <h2>校准仪表盘</h2>
        <div class="stats">
          <div class="stat">
            <div class="stat-num" id="stat-open">—</div>
            <div class="stat-label">待复盘预测</div>
          </div>
          <div class="stat">
            <div class="stat-num" id="stat-n">—</div>
            <div class="stat-label">已结算样本</div>
          </div>
          <div class="stat">
            <div class="stat-num" id="stat-hit">—</div>
            <div class="stat-label">命中率</div>
          </div>
          <div class="stat">
            <div class="stat-num" id="stat-ece">—</div>
            <div class="stat-label">期望校准误差</div>
          </div>
          <div class="stat">
            <div class="stat-num" id="stat-brier">—</div>
            <div class="stat-label">布赖尔分</div>
          </div>
        </div>
        <p id="calib-verdict" class="hint"></p>
        <div id="calib-chart" hidden>
          <h3 class="subhead">校准曲线（预测置信度 vs 实际命中率）</h3>
          <div id="calib-chart-box"></div>
          <p class="hint">柱形越贴近对角线越准；柱形在线上方＝过度自信，下方＝信心不足。</p>
        </div>

        <div id="open-predictions" hidden>
          <h3 class="subhead">待复盘预测</h3>
          <div id="open-pred-list"></div>
        </div>
      </section>

      <section class="panel">
        <h2>决策台账</h2>
        <div id="ledger-list"></div>
      </section>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
